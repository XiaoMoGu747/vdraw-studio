name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Brush invariants
        run: npm run check:brush

      - name: Tool invariants
        run: npm run check:tools

      - name: Export invariants
        run: npm run check:export

      - name: Selection frame invariants
        run: npm run check:frame

      - name: Design token lint
        run: |
          npm run design:lint > design-lint.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content design-lint.log -Raw) -replace "`r?`n", " | "
            if ($msg.Length -gt 60000) { $msg = $msg.Substring(0, 60000) }
            Write-Output "::error title=design-lint::$msg"
            exit 1
          }
          Get-Content design-lint.log

      - name: Contrast lint
        run: npm run contrast:lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle
        run: npx vite build

  # Electron smoke / check:blend need a desktop session and are kept as
  # release-gate commands (`npm run smoke`, `npm run check:blend`) rather
  # than being run on every push.
